<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore SESI</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">

        <h1>TechStore SESI</h1>

        <section class="formulario">

            <h3>Dados da Venda</h3>
            
            <label for="inputNome">Nome do cliente</label>
            <input type="text" id="inputNome" placeholder="Nome do cliente" required autocomplete="name">
            
            <label for="inputIdade">Idade</label>
            <input type="number" id="inputIdade" placeholder="Idade do cliente" min="0" required>
            
            <label for="inputValor">Valor</label>
            <input type="number" id="inputValor" placeholder="Valor Total (R$)" min="0" step="0.01" required>

            <label for="inputCupom">Cupom</label>
            <select id="inputCupom">
                <option value="false">Não possui cupom</option>
                <option value="true">Possui cupom (15%)</option>
            </select>

            <button id="btnFinalizar">Finalizar Venda</button>
            <button id="btnHistorico">Histórico de Vendas</button>

        </section>

        <dialog id="modal">
            <div id="conteudo-modal"></div>

            <button id="btn-fechar">Fechar</button>
        </dialog>

        <hr>

        <section id="feedback">

            <p id="mensagem-autorizacao">Preencha os dados acima.</p>
            <ul id="lista-estoque"></ul>
            <div id="relatorio-final" class="card" style="display: none;">
            <label>Valor total</label>
            </div>

        </section>
        
    </div>

    <script src="script.js"></script>

</body>
</html>
